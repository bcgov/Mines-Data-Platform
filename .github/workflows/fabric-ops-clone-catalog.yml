# Clone Metadata_Extractor -> pl_extract_source_catalog (full source column catalog) and run it.
# Originals untouched; reuses the existing source Postgres connection. Dispatch or push.
name: Fabric Ops - Clone Source Catalog

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Also run the cloned pipeline (true/false)'
        required: true
        default: 'true'
  push:
    branches: ['medallion/**']
    paths:
      - 'medallion/deploy/clone_source_catalog.py'
      - '.github/workflows/fabric-ops-clone-catalog.yml'

jobs:
  clone:
    name: Clone + run source-catalog pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet requests
      - run: |
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" \
              --tenant "$AZURE_TENANT_ID" --allow-no-subscriptions --output none
          export FABRIC_TOKEN="$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)"
          python3 medallion/deploy/clone_source_catalog.py
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WORKSPACE_ID: '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0'
          RUN: ${{ github.event.inputs.run || 'true' }}
