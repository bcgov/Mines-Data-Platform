# Read-only: summarize bronze Files/raw (retention + file naming) to assess a bronze rebuild.
name: Fabric Ops - List Raw

on:
  workflow_dispatch: {}
  push:
    branches: ['medallion/**']
    paths:
      - '.github/workflows/scripts/list_raw.sh'
      - '.github/workflows/fabric-ops-list-raw.yml'

jobs:
  list-raw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y jq curl
      - run: chmod +x .github/workflows/scripts/list_raw.sh
      - run: .github/workflows/scripts/list_raw.sh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WORKSPACE_ID: '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0'
