# Deploy the gold build framework + run the orchestrator (DAG-driven dim/fact build) as
# the SPN, then verify via the warehouse app.gold_run_log. medallion/** push or dispatch.
name: Deploy and Run Gold

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: 'Fabric workspace ID'
        required: true
        default: '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0'
  push:
    branches: ['medallion/**']
    paths:
      - 'Fabric/nb_util_gold.Notebook/**'
      - 'Fabric/nb_gold_tf_dim_permit.Notebook/**'
      - 'Fabric/nb_gold_tf_fact_permit_amendment.Notebook/**'
      - 'Fabric/nb_gold_orchestrator.Notebook/**'
      - 'medallion/deploy/deploy_notebook.py'
      - 'medallion/sql/verify_gold.sql'
      - '.github/workflows/scripts/run_gold.sh'
      - '.github/workflows/deploy-run-gold.yml'

jobs:
  gold:
    name: Deploy + run + verify Gold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (ODBC + python libs)
        run: |
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev jq curl
          python3 -m pip install --quiet requests pyodbc
      - name: Make script executable
        run: chmod +x .github/workflows/scripts/run_gold.sh
      - name: Deploy + run + verify
        run: .github/workflows/scripts/run_gold.sh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WORKSPACE_ID: ${{ github.event.inputs.workspace_id || '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0' }}
          WAREHOUSE_NAME: 'mines-data-platform-fabwh1'
