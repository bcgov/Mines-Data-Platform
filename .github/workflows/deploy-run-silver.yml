# Deploy + run nb_silver_build directly in the workspace (SPN), then verify via the
# Silver lakehouse SQL endpoint. Triggers on medallion/** pushes or manual dispatch.
name: Deploy and Run Silver

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: 'Fabric workspace ID'
        required: true
        default: '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0'
  push:
    branches: ['medallion/**']
    paths:
      - 'Fabric/nb_silver_build.Notebook/**'
      - 'medallion/deploy/deploy_notebook.py'
      - 'medallion/sql/verify_silver.sql'
      - '.github/workflows/scripts/run_silver.sh'
      - '.github/workflows/deploy-run-silver.yml'

jobs:
  silver:
    name: Deploy + run + verify Silver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (ODBC + python libs)
        run: |
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev jq curl
          python3 -m pip install --quiet requests pyodbc
      - name: Make script executable
        run: chmod +x .github/workflows/scripts/run_silver.sh
      - name: Deploy + run + verify
        run: .github/workflows/scripts/run_silver.sh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WORKSPACE_ID: ${{ github.event.inputs.workspace_id || '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0' }}
          # Verify by reading the run log the notebook writes to the Bronze lakehouse
          # (its SQL endpoint syncs fast, unlike the fresh Silver one).
          VERIFY_LH_ID: '8cd34a44-500a-47d9-aa2d-5ad0c2149858'
          VERIFY_LH_NAME: 'mines_data_platform_lh1'
