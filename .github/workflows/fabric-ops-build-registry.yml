# Rebuild object_registry + field_registry from the source catalog (fast; no full silver build).
name: Fabric Ops - Build Registry

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: 'Fabric workspace ID'
        required: true
        default: '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0'
  push:
    branches: ['medallion/**']
    paths:
      - 'Fabric/Notebook/nb_silver_registry.Notebook/**'
      - 'medallion/sql/verify_registry.sql'
      - '.github/workflows/scripts/run_registry.sh'
      - '.github/workflows/fabric-ops-build-registry.yml'

jobs:
  registry:
    name: Build + verify registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev jq curl
          python3 -m pip install --quiet requests pyodbc
      - run: chmod +x .github/workflows/scripts/run_registry.sh
      - run: .github/workflows/scripts/run_registry.sh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WORKSPACE_ID: ${{ github.event.inputs.workspace_id || '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0' }}
          WAREHOUSE_NAME: 'mines-data-platform-fabwh1'
