# Read-only feasibility probe: can we read/clone pl_ingest_mds and reuse its source connection?
name: Fabric Ops - Probe Pipeline

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: 'Fabric workspace ID'
        required: true
        default: '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0'
  push:
    branches: ['medallion/**']
    paths:
      - 'medallion/deploy/probe_pipeline.py'
      - '.github/workflows/fabric-ops-probe-pipeline.yml'

jobs:
  probe:
    name: Probe pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet requests
      - run: |
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" \
              --tenant "$AZURE_TENANT_ID" --allow-no-subscriptions --output none
          export FABRIC_TOKEN="$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)"
          python3 medallion/deploy/probe_pipeline.py
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WORKSPACE_ID: ${{ github.event.inputs.workspace_id || '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0' }}
