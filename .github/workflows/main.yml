name: Fabric Deployment Pipeline

on:
  push:
    branches:
      - "feature/**"
      - "hotfix/**"
      - "dev"
      - "test"
      - "main"
  pull_request:
    branches:
      - "main"
      - "test"
      - "dev"
    types: [closed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy manually"
        required: true
        default: "dev"
        type: choice
        options: [dev, test, prod]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  VAR_PREFIX:           ENV_VARS
  FABRIC_VAR_FILE_PATH: variable_template.VariableLibrary/variables.json
  FABRIC_CONNECTION_ID: ${{ vars.FABRIC_CONNECTION_ID }}
  WORKSPACE_ADMIN_ID:   ${{ vars.WORKSPACE_ADMIN_ID }}

jobs:
  # ══════════════════════════════════════════════════════════════
  # 0. Resolve deployment context
  #
  #    Determines which environment to target and whether a
  #    feature workspace should be created. All downstream jobs
  #    read these outputs instead of repeating if conditions.
  #
  #    Branch → environment mapping:
  #      feature/** | hotfix/** → dev   (feature workspace created)
  #      dev                    → dev   (no feature workspace)
  #      test                   → test
  #      main                   → prod
  #      PR merged → test       → test
  #      PR merged → main       → prod
  #      workflow_dispatch      → input
  # ══════════════════════════════════════════════════════════════
  resolve-context:
    name: "0. Resolve Deployment Context"
    runs-on: ubuntu-latest
    # Skip [skip ci] commits from the bot
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    outputs:
      environment:        ${{ steps.ctx.outputs.environment }}
      deploy_dev:         ${{ steps.ctx.outputs.deploy_dev }}
      deploy_test:        ${{ steps.ctx.outputs.deploy_test }}
      deploy_prod:        ${{ steps.ctx.outputs.deploy_prod }}
      is_feature_branch:  ${{ steps.ctx.outputs.is_feature_branch }}
      has_open_pr:        ${{ steps.ctx.outputs.has_open_pr }}
      commit_subject:     ${{ steps.ctx.outputs.commit_subject }}
      run_spn_check:      ${{ steps.ctx.outputs.run_spn_check }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          REF="${{ github.ref }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          MERGED="${{ github.event.pull_request.merged }}"

          ENV=""
          DEPLOY_DEV=false
          DEPLOY_TEST=false
          DEPLOY_PROD=false
          IS_FEATURE=false
          HAS_OPEN_PR=false
          RUN_SPN=false

          if [[ "$EVENT" == "push" ]]; then
            RUN_SPN=true
            if [[ "$REF" == refs/heads/feature/* || "$REF" == refs/heads/hotfix/* ]]; then
              ENV=dev
              DEPLOY_DEV=true
              IS_FEATURE=true

              # Check if an open PR exists for this branch
              # Feature workspace only created when a PR is open
              PR_COUNT=$(gh pr list \
                --repo "${{ github.repository }}" \
                --head "${GITHUB_REF_NAME}" \
                --state open \
                --json number \
                --jq length)

              if [[ "$PR_COUNT" -gt 0 ]]; then
                HAS_OPEN_PR=true
                echo "Open PR found for '${GITHUB_REF_NAME}' — feature workspace will be created"
              else
                HAS_OPEN_PR=false
                echo "No open PR for '${GITHUB_REF_NAME}' — skipping feature workspace creation"
              fi

            elif [[ "$REF" == "refs/heads/dev" ]]; then
              ENV=dev
              DEPLOY_DEV=true
            elif [[ "$REF" == "refs/heads/test" ]]; then
              ENV=test
              DEPLOY_TEST=true
            elif [[ "$REF" == "refs/heads/main" ]]; then
              ENV=prod
              DEPLOY_PROD=true
            fi

          elif [[ "$EVENT" == "pull_request" && "$MERGED" == "true" ]]; then
            if [[ "$BASE_REF" == "dev" ]]; then
              ENV=dev
              DEPLOY_DEV=true
            elif [[ "$BASE_REF" == "test" ]]; then
              ENV=test
              DEPLOY_TEST=true
            elif [[ "$BASE_REF" == "main" ]]; then
              ENV=prod
              DEPLOY_PROD=true
            fi

          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            RUN_SPN=true
            ENV="${{ inputs.environment }}"
            [[ "$ENV" == "dev"  ]] && DEPLOY_DEV=true
            [[ "$ENV" == "test" ]] && DEPLOY_TEST=true
            [[ "$ENV" == "prod" ]] && DEPLOY_PROD=true
          fi

          # Capture commit subject
          if [[ "$EVENT" == "push" ]]; then
            subject="$(printf "%s" "${{ github.event.head_commit.message }}" | sed -n '1p' | tr -d '\r')"
            subject="${subject#chore: }"
          elif [[ "$EVENT" == "pull_request" ]]; then
            subject="${{ github.event.pull_request.title }}"
          else
            subject="manual deploy $ENV — ${GITHUB_SHA::7}"
          fi

          echo "environment=$ENV"              >> "$GITHUB_OUTPUT"
          echo "deploy_dev=$DEPLOY_DEV"        >> "$GITHUB_OUTPUT"
          echo "deploy_test=$DEPLOY_TEST"      >> "$GITHUB_OUTPUT"
          echo "deploy_prod=$DEPLOY_PROD"      >> "$GITHUB_OUTPUT"
          echo "is_feature_branch=$IS_FEATURE" >> "$GITHUB_OUTPUT"
          echo "has_open_pr=$HAS_OPEN_PR"      >> "$GITHUB_OUTPUT"
          echo "commit_subject=$subject"       >> "$GITHUB_OUTPUT"
          echo "run_spn_check=$RUN_SPN"        >> "$GITHUB_OUTPUT"

          echo "──────────────────────────────────"
          echo "Event      : $EVENT"
          echo "Ref        : $REF"
          echo "Environment: $ENV"
          echo "Deploy dev : $DEPLOY_DEV"
          echo "Deploy test: $DEPLOY_TEST"
          echo "Deploy prod: $DEPLOY_PROD"
          echo "Is feature : $IS_FEATURE"
          echo "──────────────────────────────────"

      - name: Run SPN Evaluator
        if: steps.ctx.outputs.run_spn_check == 'true'
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          chmod +x ./.github/workflows/scripts/spn_evaluator.sh
          ./.github/workflows/scripts/spn_evaluator.sh --output table

  # ══════════════════════════════════════════════════════════════
  # 1. Create Feature Workspace
  #    Only for feature/** and hotfix/** branches
  # ══════════════════════════════════════════════════════════════
  # create-feature-workspace:
  #   name: "1. Create Feature Workspace"
  #   needs: [resolve-context]
  #   if: >
  #     needs.resolve-context.outputs.is_feature_branch == 'true' &&
  #     needs.resolve-context.outputs.has_open_pr == 'true'
  #   uses: ./.github/workflows/create-fabric-workspace.yml
  #   with:
  #     branch-name:          ${{ github.ref_name }}
  #     workspace-prefix:     feat
  #     capacity-id:          ${{ vars.DEV_CAPACITY_ID }}
  #     git-branch:           ${{ github.ref_name }}
  #     fabric-connection-id: ${{ vars.FABRIC_CONNECTION_ID }}
  #     workspace-admin-id:   ${{ vars.WORKSPACE_ADMIN_ID }}
  #   secrets:
  #     AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
  #     AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  #     AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}

  # ══════════════════════════════════════════════════════════════
  # 1b. Create PR feature → dev (pipeline pauses here)
  #     User must manually merge the PR to trigger the dev deploy.
  #     Only for feature/hotfix branches — direct dev pushes,
  #     workflow_dispatch and PR-triggered flows skip this gate.
  # ══════════════════════════════════════════════════════════════
  create-dev-pr:
    name: "1b. Create PR feature → dev"
    needs: [resolve-context]
    if: >
      needs.resolve-context.outputs.deploy_dev == 'true' &&
      needs.resolve-context.outputs.is_feature_branch == 'true' &&
      github.event_name == 'push'
    uses: ./.github/workflows/create-gitflow-pr.yml
    with:
      source-branch:        ${{ github.ref_name }}
      target-branch:        dev
      pr-title:             ${{ needs.resolve-context.outputs.commit_subject }}
      auto-approve:         false
      auto-merge:           false
      delete-source-branch: false
      squash:               false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════
  # 2. Initialize Dev Warehouse
  #    Runs first in the dev flow — before variables or deployment.
  #    Idempotent: safe to run on every deploy.
  #    Feature/hotfix: runs after PR merged feature → dev
  #    Direct dev push / workflow_dispatch: runs immediately
  # ══════════════════════════════════════════════════════════════
  initialize-dev-warehouse:
    name: "2. Initialize Dev Warehouse"
    needs: [resolve-context]
    if: >
      needs.resolve-context.outputs.deploy_dev == 'true' &&
      (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.merged == true &&
         github.event.pull_request.base.ref == 'dev') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
      )
    uses: bcgov/Mines-Data-Platform/.github/workflows/initialize-warehouse.yml@dev
    with:
      environment:  dev
      workspace-id: ${{ vars.DEV_WORKSPACE_ID }}
      warehouse-id: ${{ vars.DEV_WAREHOUSE_ID }}
    secrets:
      tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
      client-id:     ${{ secrets.AZURE_CLIENT_ID }}
      client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  # ══════════════════════════════════════════════════════════════
  # 3. Update Dev Variables
  #    Feature/hotfix: runs after PR merged feature → dev
  #    Direct dev push / workflow_dispatch: runs immediately
  # ══════════════════════════════════════════════════════════════
  update-dev-variables:
    name: "3. Update Dev Variables"
    needs: [resolve-context, initialize-dev-warehouse]
    if: >
      needs.initialize-dev-warehouse.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update variables.json for Dev
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          chmod +x ./.github/workflows/scripts/update_variables.sh
          ./.github/workflows/scripts/update_variables.sh \
            -p ${{ env.VAR_PREFIX }} \
            -e DEV \
            -f ${{ env.FABRIC_VAR_FILE_PATH }} \
            -r ${{ github.repository }}

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "${{ needs.resolve-context.outputs.commit_subject }} [skip ci]"
          git pull --no-rebase origin "${GITHUB_REF_NAME}" || true
          git push

  # ══════════════════════════════════════════════════════════════
  # ══════════════════════════════════════════════════════════════
  # 4. Deploy to Dev
  # ══════════════════════════════════════════════════════════════
  deploy-to-dev:
    name: "4. Deploy to Dev"
    needs: [update-dev-variables]
    if: needs.update-dev-variables.result == 'success'
    uses: ./.github/workflows/update-workspace-git.yml
    with:
      workspace-id:         ${{ vars.DEV_WORKSPACE_ID }}
      fabric-connection-id: ${{ vars.FABRIC_CONNECTION_ID }}
      git-branch:           ${{ github.ref_name }}
    secrets:
      tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
      client-id:     ${{ secrets.AZURE_CLIENT_ID }}
      client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  # ══════════════════════════════════════════════════════════════
  # 5. Update Test Variables
  # ══════════════════════════════════════════════════════════════
  update-test-variables:
    name: "5. Update Test Variables"
    needs: [resolve-context]
    if: needs.resolve-context.outputs.deploy_test == 'true' 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update variables.json for Test
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          chmod +x ./.github/workflows/scripts/update_variables.sh
          ./.github/workflows/scripts/update_variables.sh \
            -p ${{ env.VAR_PREFIX }} \
            -e TEST \
            -f ${{ env.FABRIC_VAR_FILE_PATH }} \
            -r ${{ github.repository }}

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "${{ needs.resolve-context.outputs.commit_subject }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push

  # ══════════════════════════════════════════════════════════════
  # 6. Create PR feature → test
  #    Only for feature/hotfix branches — direct test pushes skip
  # ══════════════════════════════════════════════════════════════
  create-test-pr:
    name: "6. Create PR feature → test"
    needs: [resolve-context, update-test-variables]
    if: >
      needs.update-test-variables.result == 'success' &&
      needs.resolve-context.outputs.is_feature_branch == 'true'
    uses: ./.github/workflows/create-gitflow-pr.yml
    with:
      source-branch:        ${{ github.ref_name }}
      target-branch:        test
      pr-title:             ${{ needs.resolve-context.outputs.commit_subject }}
      auto-approve:         false
      auto-merge:           false
      delete-source-branch: false
      squash:               false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════
  # 7. Deploy to Test
  #    Triggered by: PR merged feature→test, direct test push,
  #                  workflow_dispatch test, update-test-variables
  # ══════════════════════════════════════════════════════════════
  deploy-to-test:
    name: "7. Deploy to Test"
    needs: [resolve-context, update-test-variables]
    if: >
      always() &&
      needs.resolve-context.outputs.deploy_test == 'true' &&
      (needs.update-test-variables.result == 'success' ||
       needs.update-test-variables.result == 'skipped')
    uses: ./.github/workflows/update-workspace-git.yml
    with:
      workspace-id:         ${{ vars.TEST_WORKSPACE_ID }}
      fabric-connection-id: ${{ vars.FABRIC_CONNECTION_ID }}
      git-branch:           test
    secrets:
      tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
      client-id:     ${{ secrets.AZURE_CLIENT_ID }}
      client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  initialize-test-warehouse:
    name: "7b. Initialize Test Warehouse"
    needs: [deploy-to-test]
    if: needs.deploy-to-test.result == 'success'
    uses: bcgov/Mines-Data-Platform/.github/workflows/initialize-warehouse.yml@dev
    with:
      environment:  test
      workspace-id: ${{ vars.TEST_WORKSPACE_ID }}
      warehouse-id: ${{ vars.TEST_WAREHOUSE_ID }}
    secrets:
      tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
      client-id:     ${{ secrets.AZURE_CLIENT_ID }}
      client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  # Waits on warehouse init — prod PR only raised once test is fully ready
  create-prod-pr:
    name: "8. Create PR test → main"
    needs: [resolve-context, deploy-to-test, initialize-test-warehouse]
    if: >
      needs.deploy-to-test.result == 'success' &&
      needs.initialize-test-warehouse.result == 'success' &&
      needs.resolve-context.outputs.is_feature_branch == 'true'
    uses: ./.github/workflows/create-gitflow-pr.yml
    with:
      source-branch:        test
      target-branch:        main
      pr-title:             ${{ needs.resolve-context.outputs.commit_subject }}
      auto-approve:         false
      auto-merge:           false
      delete-source-branch: false
      squash:               true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════
  # 9. Update Prod Variables
  #    Triggered by: PR merged test→main, direct main push,
  #                  workflow_dispatch prod
  # ══════════════════════════════════════════════════════════════
  update-prod-variables:
    name: "9. Update Prod Variables"
    needs: [resolve-context]
    if: needs.resolve-context.outputs.deploy_prod == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update variables.json for Production
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          chmod +x ./.github/workflows/scripts/update_variables.sh
          ./.github/workflows/scripts/update_variables.sh \
            -p ${{ env.VAR_PREFIX }} \
            -e PROD \
            -f ${{ env.FABRIC_VAR_FILE_PATH }} \
            -r ${{ github.repository }}

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "${{ needs.resolve-context.outputs.commit_subject }} [skip ci]"
          git pull --rebase origin main
          git push origin main

  deploy-to-prod:
    name: "10. Deploy to Production"
    needs: [update-prod-variables]
    if: needs.update-prod-variables.result == 'success'
    uses: ./.github/workflows/update-workspace-git.yml
    with:
      workspace-id:         ${{ vars.PROD_WORKSPACE_ID }}
      fabric-connection-id: ${{ vars.FABRIC_CONNECTION_ID }}
      git-branch:           main
    secrets:
      tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
      client-id:     ${{ secrets.AZURE_CLIENT_ID }}
      client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  initialize-prod-warehouse:
    name: "10b. Initialize Prod Warehouse"
    needs: [deploy-to-prod]
    if: needs.deploy-to-prod.result == 'success'
    uses: bcgov/Mines-Data-Platform/.github/workflows/initialize-warehouse.yml@dev
    with:
      environment:  prod
      workspace-id: ${{ vars.PROD_WORKSPACE_ID }}
      warehouse-id: ${{ vars.PROD_WAREHOUSE_ID }}
    secrets:
      tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
      client-id:     ${{ secrets.AZURE_CLIENT_ID }}
      client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}