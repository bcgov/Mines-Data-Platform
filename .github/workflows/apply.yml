name: 'Create/Update Infrastructure'

on:
  push:
    branches: [ "main", "staging"]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'test'
        type: choice
        options:
          - 'test'
          - 'prod'
      dry_run:
        description: 'Dry Run'
        required: true
        default: 'false'
        type: choice
        options:
          - "false"
          - "true"



permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: "Terraform Formatting Check"
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: OpenTofu Setup - Setup Terraform
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0

      - name: Terraform Format Check
        run: tofu fmt -check
        working-directory: ./terraform

  # scan:
  #   name: "Security Scan (Terrascan)"
  #   runs-on: self-hosted
  #   defaults:
  #     run:
  #       shell: bash
  #   needs: lint
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Terrascan Install
  #       run: |
  #         curl --location https://github.com/accurics/terrascan/releases/download/v1.3.1/terrascan_1.3.1_Linux_x86_64.tar.gz --output terrascan.tar.gz
  #         tar -xvf terrascan.tar.gz
  #         sudo install terrascan /usr/local/bin

  #     - name: Run Terrascan
  #       run: terrascan scan -t azure -i terraform --skip-rules="accurics.azure.NS.272"
  #       working-directory: terraform

  apply:
    name: "Execute Terraform"
    runs-on: self-hosted
    needs: lint
    environment: ${{ github.event.inputs.environment || 'test' }}
    defaults:
      run:
        shell: bash
    env:
      TF_LOG: INFO
      TF_LOG_PATH: ./terraform/tf.log
      ARM_CLIENT_ID: ${{ secrets.SERVICE_PRINCIPAL_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ vars.TF_VAR_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.TF_VAR_TENANT_ID }}

      TF_VAR_LICENSEPLATE: ${{ vars.TF_VAR_LICENSEPLATE }}
      TF_VAR_LOCATION: ${{ vars.TF_VAR_LOCATION }}
      TF_VAR_LOCATIONABBR: ${{ vars.TF_VAR_LOCATIONABBR }}
      TF_VAR_subnet_names: ${{ vars.TF_VAR_SUBNET_NAMES }}
      TF_VAR_tenant_id: ${{ vars.TF_VAR_TENANT_ID }}
      TF_VAR_TAGS: ${{ vars.TF_VAR_TAGS }}
      TF_VAR_JUMPBOX_SKU: ${{ vars.TF_VAR_JUMPBOX_SKU }}
      TF_VAR_environment: ${{ vars.TF_VAR_ENVIRONMENT }}
      TF_VAR_subscription_id: ${{ vars.TF_VAR_SUBSCRIPTION_ID }}
      TF_VAR_address_space: ${{ secrets.ADDRESS_SPACE }}
      TF_VAR_virtual_network_name: ${{ vars.virtual_network_name }}
      TF_VAR_virtual_network_resource_group: ${{ vars.virtual_network_resource_group }}
      TF_VAR_bastionSubnetAddressPrefix: ${{ vars.bastionSubnetAddressPrefix }}

      service_principal_id: ${{ secrets.service_principal_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2.2.0
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.SERVICE_PRINCIPAL_ID }}
          tenant-id: ${{ vars.TF_VAR_TENANT_ID }}
          subscription-id: ${{ vars.TF_VAR_SUBSCRIPTION_ID }}

      - name: Add IP to Storage Account Firewall
        run: |
          echo "Adding IP to Tools Storage Account Firewall"
          az account set --subscription ${{ vars.TF_VAR_TOOLS_SUBSCRIPTION_ID }}
          az storage account network-rule add --resource-group ef74b0-tools-unmanaged --account-name stgmdptfstateca --ip-address $(curl -s https://api.ipify.org)
          echo "IP Added to Storage Account Firewall"
          az account set --subscription ${{ vars.TF_VAR_SUBSCRIPTION_ID }}
      
      - name: Show Fabric Token Audience
        run: az account get-access-token --resource https://api.fabric.microsoft.com

      - name: OpenTofu Setup - Setup Terraform
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Terraform Init
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Inputs: ${{ github.event.inputs }}"

          tofu init -upgrade -backend-config="../environments/${{ github.event.inputs.environment || 'test' }}/backend.conf"
        working-directory: ./terraform

      - name: Terraform Plan
        run: tofu plan -input=false -out=tfplan
        working-directory: ./terraform

      - name: Terraform Apply
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled, skipping apply step."
            exit 0
          fi
          tofu apply -auto-approve -input=false tfplan
        working-directory: ./terraform

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: tf_logs
          path: ./terraform/tf.log