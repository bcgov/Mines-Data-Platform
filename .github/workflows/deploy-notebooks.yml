# Deploy foundation notebooks into the workspace via the Fabric Items API and run the
# smoke notebook, as the SPN. Triggers on medallion/** pushes or manual dispatch.
name: Deploy Notebooks and Smoke

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: 'Fabric workspace ID'
        required: true
        default: '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0'
  push:
    branches: ['medallion/**']
    paths:
      - 'medallion/deploy/deploy_notebooks.py'
      - '.github/workflows/scripts/deploy_notebooks.sh'
      - '.github/workflows/deploy-notebooks.yml'
      - 'Fabric/Notebook/utility/nb_util_paths.Notebook/**'
      - 'Fabric/Notebook/test/nb_smoke_foundation.Notebook/**'

jobs:
  deploy:
    name: Deploy notebooks + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: python3 -m pip install --quiet requests
      - name: Make script executable
        run: chmod +x .github/workflows/scripts/deploy_notebooks.sh
      - name: Deploy + run smoke
        run: .github/workflows/scripts/deploy_notebooks.sh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WORKSPACE_ID: ${{ github.event.inputs.workspace_id || '8f380f88-5ce5-48d1-9fa5-fbbfbe2685a0' }}
          BRONZE_LH_ID: '8cd34a44-500a-47d9-aa2d-5ad0c2149858'
          SILVER_LH_ID: 'a0190e0e-c2f5-4740-ab90-a2f29b6e6991'
          GOLD_LH_ID:   '5e43f78b-2156-4469-980e-bffda0295fac'
