# .github/workflows/initialize-warehouse.yml
name: Initialize Warehouse

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Environment label (dev | test | prod)"
      workspace-id:
        required: true
        type: string
        description: "Fabric Workspace ID"
      warehouse-id:
        required: true
        type: string
        description: "Fabric Warehouse ID"
    secrets:
      tenant-id:
        required: true
      client-id:
        required: true
      client-secret:
        required: true

jobs:
  initialize-warehouse:
    name: Initialize Warehouse (${{ inputs.environment }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sqlcmd
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev jq
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Make script executable
        run: chmod +x ./initialize/warehouse_init.sh

      - name: Initialize Warehouse
        env:
          AZURE_TENANT_ID:     ${{ secrets.tenant-id }}
          AZURE_CLIENT_ID:     ${{ secrets.client-id }}
          AZURE_CLIENT_SECRET: ${{ secrets.client-secret }}
          WORKSPACE_ID:        ${{ inputs.workspace-id }}
          WAREHOUSE_ID:        ${{ inputs.warehouse-id }}
        run: ./initialize/warehouse_init.sh

      - name: Summary
        run: |
          echo "### Warehouse Initialization Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}"  >> $GITHUB_STEP_SUMMARY
          echo "- **Workspace ID**: ${{ inputs.workspace-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Warehouse ID**: ${{ inputs.warehouse-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Schemas**: bronze | silver | gold | app"    >> $GITHUB_STEP_SUMMARY